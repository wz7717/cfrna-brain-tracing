name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out repository and Git-LFS payloads
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Materialize Git-LFS payloads
        run: git lfs pull

      - name: Audit Git-LFS materialization
        run: python scripts/audit_lfs_materialization.py --output "$RUNNER_TEMP/LFS_MATERIALIZATION_AUDIT.json"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-repro.txt

      - name: Install reproducibility and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-repro.txt

      - name: Audit public release content and package integrity
        run: |
          python scripts/audit_public_release_content.py --output "$RUNNER_TEMP/PUBLIC_RELEASE_CONTENT_AUDIT.json"
          python scripts/generate_package_integrity.py --check

      - name: Run pytest with branch coverage
        run: |
          python -m coverage run --branch --source=core -m pytest tests -q --junitxml="$RUNNER_TEMP/junit.xml"
          python -m coverage report -m
          python -m coverage xml -o "$RUNNER_TEMP/coverage.xml"

      - name: Run scientific freeze audit
        run: python scripts/audit_scientific_freeze.py --output "$RUNNER_TEMP/SCIENTIFIC_FREEZE_AUDIT.json"

      - name: Validate tracked CSV and current provenance assets
        run: |
          python scripts/validate_csv_assets.py
          python scripts/verify_locked_artifacts.py
          python scripts/verify_nonhuang_scientific_provenance.py
          python scripts/audit_public_provenance_paths.py
          python scripts/audit_release_state.py

      - name: Run portable one-click reproduction gate
        run: python reproduce_all.py --profile portable --output-dir "$RUNNER_TEMP/portable_reproduction"

      - name: Build application image
        run: docker build --pull -t braintrace-ci .

      - name: Smoke-test application image
        run: |
          docker run --rm --entrypoint braintrace braintrace-ci --help
          docker run --rm --entrypoint braintrace braintrace-ci --version
          docker run --rm --entrypoint braintrace braintrace-ci validate

      - name: Build full-reproduction image
        run: docker build --pull --build-arg BRAINTRACE_GIT_SHA="${GITHUB_SHA}" --build-arg BRAINTRACE_GIT_CLEAN=true -f Dockerfile.repro -t braintrace-repro-ci .

      - name: Smoke-test full-reproduction image
        run: |
          docker run --rm braintrace-repro-ci --help
          docker run --rm braintrace-repro-ci --profile portable --output-dir /tmp/portable-audit
          if docker run --rm braintrace-repro-ci --verify-only --output-dir /tmp/verify-audit; then
            echo "full reproduction unexpectedly accepted a missing external-data mount" >&2
            exit 1
          fi

      - name: Upload CI audits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: braintrace-ci-audits
          path: |
            ${{ runner.temp }}/coverage.xml
            ${{ runner.temp }}/junit.xml
            ${{ runner.temp }}/LFS_MATERIALIZATION_AUDIT.json
            ${{ runner.temp }}/PUBLIC_RELEASE_CONTENT_AUDIT.json
            ${{ runner.temp }}/SCIENTIFIC_FREEZE_AUDIT.json

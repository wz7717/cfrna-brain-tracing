name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-repro.txt

      - name: Install reproducibility and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-repro.txt

      - name: Run pytest with branch coverage
        run: |
          python -m coverage run --branch --source=core -m pytest -q
          python -m coverage report -m
          python -m coverage xml -o coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: braintrace-coverage
          path: coverage.xml

      - name: Validate tracked CSV assets
        run: python scripts/validate_csv_assets.py

      - name: Reproduce S18-S19 sensitivity outputs
        run: >-
          python reproducibility/s18_s19/run_s18_s19_sensitivity.py
          --output "$RUNNER_TEMP/s18_s19_results.json"
          --manifest "$RUNNER_TEMP/s18_s19_input_manifest.json"

      - name: Verify frozen model artifact hashes
        run: python scripts/verify_locked_artifacts.py

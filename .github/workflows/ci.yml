name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-repro.txt

      - name: Install reproducibility and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-repro.txt

      - name: Run pytest
        run: python -m pytest -q

      - name: Validate tracked CSV assets
        run: python scripts/validate_csv_assets.py

      - name: Verify frozen model artifact hashes
        run: python scripts/verify_locked_artifacts.py

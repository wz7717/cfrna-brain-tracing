name: braintrace
channels:
  - conda-forge
dependencies:
  - python=3.11.9
  # Core numerics
  - numpy=1.26.4
  - scipy=1.13.1
  - pandas=2.2.3
  # Machine learning & statistics
  - scikit-learn=1.5.2
  - joblib=1.5.3
  - threadpoolctl=3.6.0
  # File format & data I/O
  - openpyxl=3.1.5
  - xlrd=2.0.1
  # Testing
  - pytest=8.3.5
  - coverage=7.14.3
  # Utilities
  - python-dateutil=2.9.0
  - six=1.17.0
  - typing_extensions=4.16.0
  - pyyaml=6.0.2
  - pip
  - pip:
            # Web application + visualization
      # (pip install: keeps the Streamlit Cloud conda solve small & fast)
      - streamlit==1.55.0
      - matplotlib==3.10.7
      - plotly==6.5.2
      # File processing (pip-only packages)
      - python-docx==1.2.0
      - defusedxml==0.7.1
      - lxml==6.1.1
      # Neuroimaging (BraTS NIfTI)
      - nibabel==5.3.2
      # PDF generation (validation reports)
      - reportlab==4.4.3
      # Excel binary format
      - pyxlsb==1.0.10
